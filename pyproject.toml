[project]
name = "lemonade-replay-studio"
version = "0.1.0"
description = "Turn long gameplay recordings into local AI highlight reels and moment maps, powered by Lemonade."
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
dependencies = [
  "Pillow>=10.0.0",
  "requests>=2.32.0",
  "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
lrs = "lemonade_replay_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonade_replay_studio"]
